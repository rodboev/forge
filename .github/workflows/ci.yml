name: CI
on:
  workflow_call:
  push:
    branches: [main]
permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read
  statuses: read
# Timing baseline sample 4 of 5.
env:
  PROBE_DURATION: "0s"
jobs:
  race:
    strategy:
      fail-fast: false
      matrix:
        shard: [server, core, rest]
        part: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests (race detector)
        env:
          RACE_SHARD: ${{ matrix.shard }}
          RACE_PART: ${{ matrix.part }}
        run: |
          mkdir -p internal/racewarningproof
          cat > internal/racewarningproof/warning_test.go <<'GO'
          package racewarningproof
          import (
              "os"
              "testing"
              "time"
          )
          func TestSlowRaceWarning(t *testing.T) {
              if os.Getenv("RACE_SHARD") == "core" && os.Getenv("RACE_PART") == "1" {
                  duration, err := time.ParseDuration(os.Getenv("PROBE_DURATION"))
                  if err != nil { t.Fatal(err) }
                  time.Sleep(duration)
              }
          }
          GO
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile "gotestsum/race-${RACE_SHARD}-${RACE_PART}.json" --jsonfile-timing-events=tmp/test-race-timing-events.json --rerun-fails=2 --rerun-fails-report "gotestsum/race-${RACE_SHARD}-${RACE_PART}-reruns.txt" --packages ./internal/racewarningproof -- -race -shuffle=on -parallel=4 -timeout 5m -run '^TestSlowRaceWarning$'
      - name: Summarize race test timings
        if: ${{ !cancelled() && hashFiles('gotestsum/race-*.json') != '' }}
        env:
          RACE_SHARD: ${{ matrix.shard }}
          RACE_PART: ${{ matrix.part }}
        run: |
          {
            echo "# Race shard $RACE_SHARD ($RACE_PART/2)"
            echo
            echo "## Slowest race packages"
            echo
            echo '```'
            jq -r '
              select(.Action == "pass" and .Package and (.Test | not) and .Elapsed)
              | "\(.Elapsed)s\t\(.Package)"
            ' tmp/test-race-timing-events.json | sort -rn | sed -n '1,30p'
            echo '```'
            echo
            echo "## Slowest race tests"
            echo
            echo '```'
            jq -r '
              select(
                (.Action == "pass" or .Action == "fail" or .Action == "skip")
                and .Package
                and .Test
                and .Elapsed
              )
              | "\(.Elapsed)s\t\(.Package)\t\(.Test)"
            ' tmp/test-race-timing-events.json | sort -rn | sed -n '1,40p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn about newly slow race tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('tmp/test-race-timing-events.json') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(mktemp -d)
          trap 'rm -rf "$baseline"' EXIT
          trap 'echo "Main race timings unavailable; comparison could not run."' ERR
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[].id')
          for run in $runs; do
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | test("^go-race-timing-(server|core|rest)-[12]$")))] | length')
            if [[ "$artifacts" == 6 ]]; then
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'go-race-timing-*' --dir "$baseline"
              break
            fi
          done
          find "$baseline" -name test-race-timing-events.json -exec cat {} + > "$baseline/main.json"
          test -s "$baseline/main.json"
          jq -sr --slurpfile main "$baseline/main.json" '
            def timings:
              map(select((.Action == "pass" or .Action == "fail" or .Action == "skip") and .Package and .Test and .Elapsed))
              | group_by([.Package, .Test]) | map(max_by(.Elapsed));
            ($main | timings | map({key: ([.Package, .Test] | tojson), value: .Elapsed}) | from_entries) as $baseline
            | timings[]
            | $baseline[[.Package, .Test] | tojson] as $previous
            | select(.Elapsed > 60 and ($previous == null or $previous <= 60))
            | "::warning title=Slow race test::\(.Package) \(.Test): \(.Elapsed)s; main: \(if $previous == null then "absent" else "\($previous)s" end)"
          ' tmp/test-race-timing-events.json > "$baseline/warnings"
          cat "$baseline/warnings"

      - name: Upload race timing artifacts
        if: ${{ !cancelled() && hashFiles('gotestsum/race-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-race-timing-${{ matrix.shard }}-${{ matrix.part }}
          path: |
            gotestsum/race-${{ matrix.shard }}-${{ matrix.part }}.json
            tmp/test-race-timing-events.json
          retention-days: 7
